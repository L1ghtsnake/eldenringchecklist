<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elden Ring Database — Gallery</title>
  <meta name="description" content="A gallery of the Lands Between — twenty scenes from Elden Ring and Shadow of the Erdtree." />
  <link rel="icon" type="image/png" href="../img/favicon.png" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/gallery.css" />
</head>
<body>
  <div class="page page-wide">

    <header class="site-header">
      <a class="brand" href="../index.html" aria-label="Elden Ring Database — home">
        <span class="brand-logo-lockup">
          <img class="brand-icon" src="../img/logo-icon.webp" alt="" aria-hidden="true" />
          <img class="brand-logo" src="../img/logo-wordmark.webp" alt="Elden Ring" />
        </span>
        <div class="brand-text">
          <p class="brand-eyebrow" id="brand-eyebrow">Gallery</p>
          <h1 class="brand-title visually-hidden" id="brand-title">Elden Ring Database — Gallery</h1>
        </div>
      </a>

      <div class="burger-menu" id="burger-menu">
      <button type="button" class="icon-btn burger-btn" id="burger-btn" aria-haspopup="true" aria-expanded="false" aria-controls="header-controls" aria-label="Menu" title="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>

      <div class="header-controls" id="header-controls">
        <div class="menu-section menu-section--prefs">
          <p class="menu-section-label" id="menu-prefs-label">Preferences</p>

          <div class="menu-group">
            <div class="lang-filter" id="lang-filter">
              <button type="button" class="icon-btn lang-filter-btn" id="lang-filter-btn" aria-haspopup="true" aria-expanded="false" aria-label="Language" title="Language">
                <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" d="M2.5 12h19M12 2.5a15 15 0 0 1 4 9.5 15 15 0 0 1-4 9.5 15 15 0 0 1-4-9.5 15 15 0 0 1 4-9.5Z"/></svg>
                <span class="icon-btn-label" id="lang-filter-btn-label">Language</span>
              </button>
              <div class="lang-filter-panel" id="lang-filter-panel" role="menu" hidden>
                <button type="button" class="lang-option active" data-lang="en" role="menuitemradio" aria-checked="true">
                  <span>English</span>
                  <svg class="lang-check" width="12" height="10" viewBox="0 0 13 10" aria-hidden="true"><path d="M1 5.2 4.6 8.5 12 1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <button type="button" class="lang-option" data-lang="ru" role="menuitemradio" aria-checked="false">
                  <span>Русский</span>
                  <svg class="lang-check" width="12" height="10" viewBox="0 0 13 10" aria-hidden="true"><path d="M1 5.2 4.6 8.5 12 1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <button type="button" class="lang-option" data-lang="kk" role="menuitemradio" aria-checked="false">
                  <span>Қазақша</span>
                  <svg class="lang-check" width="12" height="10" viewBox="0 0 13 10" aria-hidden="true"><path d="M1 5.2 4.6 8.5 12 1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </div>
            </div>

            <div class="menu-group-divider" aria-hidden="true"></div>

            <div class="theme-toggle-row">
              <span class="icon-btn-label theme-toggle-label" id="theme-toggle-label">Theme</span>
              <button id="theme-toggle" type="button" class="theme-toggle" aria-pressed="false" aria-label="Toggle dark or light theme">
                <svg class="theme-icon theme-icon--sun" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg>
                <span class="theme-toggle-thumb" aria-hidden="true"></span>
                <svg class="theme-icon theme-icon--moon" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 14.5A8.5 8.5 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5Z"/></svg>
              </button>
            </div>
          </div>
        </div>

        <div class="menu-section menu-section--account" id="menu-account-section">
          <p class="menu-section-label" id="menu-account-label">Account</p>

          <div class="auth-controls" id="auth-controls">
            <div class="menu-group">
              <button id="login-btn" type="button" class="icon-btn icon-btn--lg menu-login-btn" aria-label="Log in" title="Log in">
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
                <span class="menu-login-text">
                  <span class="icon-btn-label" id="login-btn-label">Log in</span>
                  <span class="menu-login-sub" id="login-btn-sub">Sync your progress across devices</span>
                </span>
              </button>

              <button id="account-btn" type="button" class="icon-btn icon-btn--lg icon-btn--account" aria-label="Account" title="Account" hidden>
                <img id="account-btn-avatar" class="account-btn-avatar" alt="" hidden />
                <svg id="account-btn-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 21a8 8 0 1 0-16 0M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/></svg>
                <span class="icon-btn-label" id="account-btn-label">Account</span>
              </button>

              <button type="button" class="account-profile-card" id="account-profile-card" hidden>
                <span class="account-profile-avatar" aria-hidden="true">
                  <img id="profile-card-avatar" class="account-btn-avatar" alt="" hidden />
                  <svg id="profile-card-icon" width="20" height="20" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 21a8 8 0 1 0-16 0M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/></svg>
                </span>
                <span class="account-profile-info">
                  <span class="account-profile-name" id="profile-card-name">Nickname</span>
                  <span class="account-profile-email" id="profile-card-email"></span>
                </span>
                <svg class="account-profile-chevron" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m9 6 6 6-6 6"/></svg>
              </button>

              <div class="menu-group-divider" id="account-group-divider" aria-hidden="true" hidden></div>

              <button type="button" class="menu-logout-btn" id="logout-btn-inline" hidden>
                <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                <span id="logout-inline-label">Log out</span>
              </button>
            </div>
          </div>
        </div>
      </div>
      </div>
    </header>

    <main class="gallery-page">
      <div class="gallery-intro">
        <h1 class="gallery-title" id="gallery-title">Gallery of the Lands Between</h1>
      </div>

      <div class="gallery-grid" id="gallery-grid" role="list"></div>

      <nav class="gallery-pagination" id="gallery-pagination" aria-label="Gallery pages"></nav>
    </main>

  </div>

  <!-- Lightbox — sibling of .page, like the auth/account modals, so its
       fixed overlay isn't affected by any transform/opacity on .page. -->
  <div class="lightbox-overlay" id="lightbox-overlay" hidden role="dialog" aria-modal="true" aria-label="Image viewer">
    <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="m6 6 12 12M18 6 6 18"/></svg>
    </button>

    <button type="button" class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous image">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m15 6-6 6 6 6"/></svg>
    </button>

    <div class="lightbox-stage">
      <img id="lightbox-image" class="lightbox-image" src="" alt="" />
      <p class="lightbox-counter" id="lightbox-counter">1 / 20</p>
    </div>

    <button type="button" class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next image">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="m9 6 6 6-6 6"/></svg>
    </button>
  </div>

  <!-- Auth / account modals — siblings of .page rather than nested
       inside it (see the note in checklist.html for why). -->

  <div class="modal-overlay" id="auth-modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="auth-modal-title">
      <button type="button" class="modal-close" id="auth-modal-close" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="m6 6 12 12M18 6 6 18"/></svg>
      </button>

      <div class="auth-modal-icon auth-modal-icon--login" id="auth-modal-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>
      </div>

      <h2 class="auth-modal-title" id="auth-modal-title">Log in</h2>
      <p class="auth-modal-subtitle" id="auth-modal-subtitle">Welcome back — pick up where you left off.</p>

      <form id="auth-form" class="auth-form" novalidate>
        <label class="auth-field" id="auth-nickname-field" hidden>
          <span id="auth-nickname-label">Nickname</span>
          <input id="auth-nickname" type="text" autocomplete="nickname" maxlength="24" />
        </label>
        <label class="auth-field">
          <span id="auth-email-label">Email</span>
          <input id="auth-email" type="email" required autocomplete="email" />
        </label>
        <label class="auth-field">
          <span id="auth-password-label">Password</span>
          <input id="auth-password" type="password" required minlength="6" autocomplete="current-password" />
        </label>

        <p class="auth-error" id="auth-error" hidden></p>

        <button type="submit" class="auth-submit" id="auth-submit">Log in</button>
      </form>

      <p class="auth-switch">
        <span id="auth-switch-text">Don't have an account?</span>
        <button type="button" class="auth-switch-btn" id="auth-switch-btn">Sign up</button>
      </p>
    </div>
  </div>

  <div class="modal-overlay" id="account-modal" hidden>
    <div class="modal-card modal-card--account" role="dialog" aria-modal="true" aria-labelledby="account-modal-nickname">
      <button type="button" class="modal-close" id="account-modal-close" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="m6 6 12 12M18 6 6 18"/></svg>
      </button>

      <div class="account-avatar-wrap">
        <img id="account-avatar-img" class="account-avatar-img" alt="" hidden />
        <svg id="account-avatar-fallback" class="account-avatar-fallback" width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 21a8 8 0 1 0-16 0M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/></svg>
      </div>

      <h2 class="account-nickname" id="account-modal-nickname">Nickname</h2>
      <p class="account-modal-email" id="account-modal-email"></p>
      <p class="account-modal-date" id="account-modal-date"></p>

      <a class="account-cabinet-link" id="account-cabinet-link" href="profile.html">
        <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/></svg>
        <span id="account-cabinet-link-label">Personal cabinet</span>
      </a>

      <button type="button" class="auth-submit auth-submit--danger" id="logout-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        <span id="logout-label">Log out</span>
      </button>
    </div>
  </div>

  <div class="toast" id="auth-toast" hidden role="status" aria-live="polite">
    <span class="toast-icon" aria-hidden="true">
      <svg width="13" height="10" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M20 6 9 17l-5-5"/></svg>
    </span>
    <span id="auth-toast-text"></span>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script src="../scripts/firebase.js"></script>
  <script src="../scripts/auth.js"></script>
  <script src="../scripts/gallery.js"></script>
</body>
</html>
