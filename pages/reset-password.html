<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elden Ring Database — Reset password</title>
  <link rel="icon" type="image/png" href="../img/favicon.png" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="page">

    <header class="site-header">
      <a class="brand" href="../index.html" aria-label="Elden Ring Database — home">
        <span class="brand-logo-lockup">
          <img class="brand-icon" src="../img/logo-icon.webp" alt="" aria-hidden="true" />
          <img class="brand-logo" src="../img/logo-wordmark.webp" alt="Elden Ring" />
        </span>
      </a>
    </header>

    <main class="reset-password-wrap">
      <div class="modal-card reset-password-card">
        <div class="auth-modal-icon auth-modal-icon--login" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2Zm0 0 9 6 9-6"/></svg>
        </div>

        <h1 class="auth-modal-title" id="reset-title">Reset your password</h1>
        <p class="auth-modal-subtitle" id="reset-subtitle">Enter the email on your account and we'll send you a link to reset your password.</p>

        <form id="reset-form" class="auth-form" novalidate>
          <label class="auth-field">
            <span id="reset-email-label">Email</span>
            <input id="reset-email" type="email" required autocomplete="email" />
          </label>

          <p class="auth-error" id="reset-error" hidden></p>
          <p class="reset-success" id="reset-success" hidden></p>

          <button type="submit" class="auth-submit" id="reset-submit">
            <span id="reset-submit-label">Send reset link</span>
          </button>
        </form>

        <p class="auth-switch">
          <a class="auth-switch-btn" id="reset-back-link" href="../index.html">
            <span id="reset-back-label">Back to the site</span>
          </a>
        </p>
      </div>
    </main>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script src="../scripts/firebase.js"></script>
  <script src="../scripts/reset-password.js"></script>
</body>
</html>
